<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════════
  UC STORE — متجر شحن ببجي (PUBG Mobile UC) — ملف واحد كامل
═══════════════════════════════════════════════════════════════════
  بنية قاعدة البيانات (Schema) — نفس البنية تُنقل إلى MongoDB/PostgreSQL:

  Users: {
    _id, fullName, email (unique), phone, passwordHash, salt,
    qrToken (JWT signed, unique), createdAt
  }
  Packages: { _id, name, ucAmount, price, badge, bonus, logo, active }
  Orders:   { _id, userId, packageId, playerId, paymentMethod,
              receiptName, status: pending|shipped|completed|cancelled, createdAt }

  نقاط API المقابلة عند نقلها إلى Backend (Express/FastAPI):
    POST /api/auth/register   -> إنشاء حساب + توليد QR Token
    POST /api/auth/login      -> email/phone + password
    POST /api/auth/qr-login   -> إرسال qrToken للتحقق من التوقيع (JWT)
    GET  /api/auth/me         -> بيانات المستخدم من JWT
    POST /api/orders          -> إنشاء طلب
    GET  /api/orders/:userId  -> سجل الطلبات
  مكتبات الإنتاج: qrcode، html5-qrcode، jsonwebtoken، bcrypt
═══════════════════════════════════════════════════════════════════
-->

<script>
/* ══════════════════════ طبقة "قاعدة البيانات" (localStorage) — محصّنة ══════════════════════ */
const DB = {
  read:(k)=>{
    try{
      const v=JSON.parse(localStorage.getItem(k)||'[]');
      return Array.isArray(v)?v:[];   // أي بيانات تالفة/كائن => مصفوفة فارغة
    }catch{ return []; }
  },
  write:(k,v)=>localStorage.setItem(k,JSON.stringify(Array.isArray(v)?v:[]))
};
function seedPackages(){
  if(localStorage.getItem('packages')) return;
  const pkgs=[
    {id:'p60',  name:'شدات 60 UC',   uc:60,   price:'0.99$',  bonus:'',        badge:'',          logo:'🪙'},
    {id:'p325', name:'شدات 325 UC',  uc:325,  price:'4.99$',  bonus:'+25 UC',  badge:'الأكثر مبيعاً', logo:'💰'},
    {id:'p660', name:'شدات 660 UC',  uc:660,  price:'9.99$',  bonus:'+60 UC',  badge:'عرض مميز',  logo:'💵'},
    {id:'p1800',name:'شدات 1800 UC', uc:1800, price:'24.99$', bonus:'+180 UC', badge:'قيمة ذهبية',logo:'👑'},
    {id:'p3850',name:'شدات 3850 UC', uc:3850, price:'49.99$', bonus:'+400 UC', badge:'الوحش',     logo:'🔥'},
    {id:'p8100',name:'شدات 8100 UC', uc:8100, price:'99.99$', bonus:'+900 UC', badge:'VIP',       logo:'💎'}
  ];
  localStorage.setItem('packages',JSON.stringify(pkgs));
}
seedPackages();

/* ══════════════════════ JWT + التشفير — مع fallback إذا لم يتوفر crypto.subtle ══════════════════════ */
const SECRET = 'UC_STORE_SUPER_SECRET_KEY_CHANGE_IN_PRODUCTION';
const hasSubtle = !!(window.crypto && crypto.subtle);
const b64u = buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');
const fromB64u = s=>new Uint8Array(atob(s.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>c.charCodeAt(0)));
const b64uJSON = s=>JSON.parse(atob(s.replace(/-/g,'+').replace(/_/g,'/')));

// fallback hash بسيط (djb2 متكرر) — فقط عندما يكون crypto.subtle غير متاح (غير آمن — للتجربة المحلية فقط)
function fallbackHash(str){
  let h1=5381,h2=52711;
  for(let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    h1=(h1*33^c)>>>0; h2=(h2*31^c)>>>0;
  }
  return 'fb_'+h1.toString(16)+h2.toString(16);
}
async function hmac(data){
  if(hasSubtle){
    const key = await crypto.subtle.importKey('raw',new TextEncoder().encode(SECRET),{name:'HMAC',hash:'SHA-256'},false,['sign']);
    return b64u(await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(data)));
  }
  return fallbackHash(data+SECRET);
}
// توليد JWT: header.payload.signature
async function signJWT(payload){
  const h=b64u(new TextEncoder().encode(JSON.stringify({alg:'HS256',typ:'JWT'})));
  const p=b64u(new TextEncoder().encode(JSON.stringify({...payload,iat:Date.now()})));
  return h+'.'+p+'.'+await hmac(h+'.'+p);
}
// التحقق من JWT (نفس منطق /api/auth/qr-login)
async function verifyJWT(token){
  try{
    const [h,p,s]=token.split('.');
    if(await hmac(h+'.'+p)!==s) return null;                 // توقيع خاطئ
    const payload=b64uJSON(p);
    if(payload.exp && payload.exp<Date.now()) return null;   // منتهي
    return payload;
  }catch{ return null; }
}
async function hashPassword(pw){
  if(hasSubtle){
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},key,256);
    return {salt:b64u(salt), hash:b64u(bits)};
  }
  return {salt:'fb_salt', hash:fallbackHash(pw)};
}
async function checkPassword(pw,salt,hash){
  if(hasSubtle){
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:fromB64u(salt),iterations:100000,hash:'SHA-256'},key,256);
    return b64u(bits)===hash;
  }
  return fallbackHash(pw)===hash;
}

/* ══════════════════════ أدوات مساعدة ══════════════════════ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function uid(prefix){ return prefix+'_'+(crypto.randomUUID?crypto.randomUUID().slice(0,8):Date.now().toString(36)+Math.random().toString(36).slice(2,6)); }
function toast(msg,type='ok'){
  const t=document.createElement('div');
  t.className=`toast glass rounded-xl p-4 text-sm font-semibold border-r-4 ${type==='ok'?'border-yellow-400':'border-red-500'}`;
  t.innerHTML=msg; $('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity=0;t.style.transition='.5s';setTimeout(()=>t.remove(),500)},4500);
}
function closeModal(){ $('modal').classList.add('hidden'); $('modal').classList.remove('flex'); $('modalBody').innerHTML=''; stopScanner(); }
function openModal(html){ $('modalBody').innerHTML=html; $('modal').classList.remove('hidden'); $('modal').classList.add('flex'); }

let currentUser=null;
try{ currentUser=JSON.parse(sessionStorage.getItem('session')||'null'); }catch{}
function saveSession(u){
  currentUser=u;
  u?sessionStorage.setItem('session',JSON.stringify(u)):sessionStorage.removeItem('session');
  renderNav();
  go(u?'home':'auth');
}

/* ══════════════════════ التنقل والهيدر ══════════════════════ */
function renderNav(){
  $('authArea').innerHTML = currentUser
    ? `<button onclick="go('dash')" class="text-sm font-bold text-yellow-400 hover:text-yellow-200">👤 ${esc(currentUser.fullName.split(' ')[0])}</button>
       <button onclick="logout()" class="btn-gold px-4 py-1.5 rounded-lg text-sm">خروج</button>`
    : `<button onclick="go('auth')" class="btn-gold px-5 py-2 rounded-lg text-sm">تسجيل الدخول</button>`;
}
function logout(){ saveSession(null); toast('تم تسجيل الخروج بنجاح 👋'); }
function go(page){
  stopScanner();
  if(!currentUser && page!=='auth' && page!=='home' && page!=='forgot'){ page='auth'; toast('سجّل دخولك أولاً للوصول لهذه الصفحة','err'); }
  ({home:renderHome, shop:renderShop, auth:renderAuth, dash:renderDash, forgot:renderForgot}[page]||renderHome)();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ══════════════════════ صفحة تسجيل الدخول / إنشاء حساب ══════════════════════ */
let authTab='login';
function renderAuth(){
  $('app').innerHTML=`
  <section class="min-h-[85vh] flex items-center justify-center px-4 py-10 relative overflow-hidden">
    <div class="absolute -top-32 -right-32 w-96 h-96 bg-yellow-500/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl"></div>
    <div class="glass rounded-3xl w-full max-w-md p-8 glow relative z-10">
      <div class="text-center mb-6">
        <div class="w-16 h-16 mx-auto rounded-2xl btn-gold flex items-center justify-center text-2xl font-black mb-3">UC</div>
        <h1 class="text-2xl font-black gold-text">مرحباً بك في UC STORE</h1>
        <p class="text-gray-400 text-sm mt-1">شحن شدات ببجي بسرعة وأمان</p>
      </div>
      <div class="grid grid-cols-3 gap-1 mb-6 bg-night-700 rounded-xl p-1">
        ${[['login','تسجيل دخول'],['signup','حساب جديد'],['qr','دخول بـ QR']].map(([k,l])=>
          `<button type="button" onclick="authTab='${k}';renderAuth()" class="py-2 rounded-lg text-xs sm:text-sm font-bold transition ${authTab===k?'btn-gold':'text-gray-400 hover:text-white'}">${l}</button>`).join('')}
      </div>
      <div id="authForm"></div>
    </div>
  </section>`;
  const f=$('authForm');
  if(authTab==='login') f.innerHTML=`
    <form onsubmit="doLogin(event)" class="space-y-4">
      <div><label class="text-xs font-bold text-gray-400">البريد الإلكتروني أو رقم الهاتف</label>
        <input id="li_id" required class="w-full rounded-xl px-4 py-3 mt-1" placeholder="example@mail.com أو 07xxxxxxxx"></div>
      <div><label class="text-xs font-bold text-gray-400">كلمة السر</label>
        <input id="li_pw" type="password" required class="w-full rounded-xl px-4 py-3 mt-1" placeholder="••••••••"></div>
      <div class="text-left"><a href="#" onclick="go('forgot');return false" class="text-yellow-400 text-xs font-bold hover:underline">نسيت كلمة السر؟</a></div>
      <button class="btn-gold w-full py-3 rounded-xl">دخول ⚡</button>
    </form>`;
  else if(authTab==='signup') f.innerHTML=`
    <form onsubmit="doSignup(event)" class="space-y-3">
      <div><label class="text-xs font-bold text-gray-400">الاسم الكامل</label>
        <input id="su_name" required class="w-full rounded-xl px-4 py-2.5 mt-1" placeholder="اسمك الكامل"></div>
      <div><label class="text-xs font-bold text-gray-400">البريد الإلكتروني</label>
        <input id="su_mail" type="email" required class="w-full rounded-xl px-4 py-2.5 mt-1" placeholder="example@mail.com"></div>
      <div><label class="text-xs font-bold text-gray-400">رقم الهاتف</label>
        <input id="su_phone" required type="tel" class="w-full rounded-xl px-4 py-2.5 mt-1" placeholder="07xxxxxxxxxx">
        <p id="su_err" class="text-red-400 text-xs mt-1"></p></div>
      <div><label class="text-xs font-bold text-gray-400">كلمة السر (8 أحرف على الأقل)</label>
        <input id="su_pw" type="password" required minlength="8" class="w-full rounded-xl px-4 py-2.5 mt-1" placeholder="••••••••"></div>
      <button class="btn-gold w-full py-3 rounded-xl">إنشاء حساب + توليد QR 🎫</button>
    </form>`;
  else f.innerHTML=`
    <div class="space-y-4">
      <button type="button" onclick="startScanner()" class="btn-gold w-full py-3.5 rounded-xl text-lg">📷 فتح الكاميرا للمسح</button>
      <div class="text-center text-gray-500 text-xs">— أو —</div>
      <label class="block border-2 border-dashed border-yellow-500/40 rounded-xl p-6 text-center cursor-pointer hover:border-yellow-500 transition">
        <input type="file" accept="image/*" class="hidden" onchange="scanImageFile(this)">
        <div class="text-3xl mb-1">🖼️</div>
        <span class="text-sm text-gray-300 font-bold">رفع صورة رمز QR</span>
        <p class="text-xs text-gray-500 mt-1">من ملف كرت حسابك</p>
      </label>
      <div id="qr-reader" class="hidden"></div>
    </div>`;
}
async function doLogin(e){
  e.preventDefault();
  try{
    const id=$('li_id').value.trim(), pw=$('li_pw').value;
    const users=DB.read('users');
    const u=users.find(x=>x.email===id||x.phone===id);
    if(!u || !(await checkPassword(pw,u.salt,u.passwordHash))) return toast('❌ بيانات الدخول غير صحيحة','err');
    saveSession({id:u.id,fullName:u.fullName,email:u.email,phone:u.phone});
    toast(`✅ أهلاً بعودتك ${esc(u.fullName.split(' ')[0])}!`);
  }catch(err){
    console.error('Login error:',err);
    toast('❌ حدث خطأ: '+esc(err.message||err),'err');
  }
}
async function doSignup(e){
  e.preventDefault();
  try{
    const users=DB.read('users');
    const name=$('su_name').value.trim(), mail=$('su_mail').value.trim().toLowerCase(),
          phone=$('su_phone').value.trim(), pw=$('su_pw').value;
    $('su_err').textContent='';
    const digits=phone.replace(/\D/g,'');
    if(digits.length<9||digits.length>15){
      $('su_err').textContent='⚠️ رقم الهاتف غير صالح (9–15 رقماً)'; return;
    }
    if(users.some(u=>u.email===mail)) return toast('❌ البريد الإلكتروني مسجل مسبقاً','err');
    if(users.some(u=>u.phone===digits)) return toast('❌ رقم الهاتف مسجل مسبقاً','err');
    const {salt,hash}=await hashPassword(pw);
    const id=uid('u');
    // توكن QR فريد مرتبط بحساب المستخدم — JWT بصلاحية سنة
    const qrToken=await signJWT({sub:id,typ:'QR_LOGIN',exp:Date.now()+365*24*3600e3});
    const user={id,fullName:name,email:mail,phone:digits,salt,passwordHash:hash,qrToken,createdAt:Date.now()};
    users.push(user); DB.write('users',users);
    saveSession({id,fullName:name,email:mail,phone:digits});
    toast('🎉 تم إنشاء حسابك! كرت QR جاهز في لوحة حسابك');
    go('dash');
  }catch(err){
    console.error('Signup error:',err);
    toast('❌ حدث خطأ: '+esc(err.message||err),'err');
  }
}
function renderForgot(){
  $('app').innerHTML=`
  <section class="min-h-[85vh] flex items-center justify-center px-4">
    <div class="glass rounded-3xl w-full max-w-md p-8">
      <h2 class="text-xl font-black gold-text mb-4">🔑 استعادة كلمة السر</h2>
      <form onsubmit="event.preventDefault();toast('📩 أُرسل رابط إعادة التعيين إلى بريدك (محاكاة)');go('auth')" class="space-y-4">
        <input required class="w-full rounded-xl px-4 py-3" placeholder="بريدك الإلكتروني المسجل">
        <button class="btn-gold w-full py-3 rounded-xl">إرسال رابط إعادة التعيين</button>
        <a href="#" onclick="go('auth');return false" class="block text-center text-yellow-400 text-sm font-bold">رجوع لتسجيل الدخول</a>
      </form>
    </div>
  </section>`;
}

/* ══════════════════════ تسجيل الدخول عبر QR ══════════════════════ */
let scanner=null;
function stopScanner(){ if(scanner){try{scanner.stop().catch(()=>{});scanner.clear();}catch{} scanner=null;} }
function startScanner(){
  const el=$('qr-reader'); el.classList.remove('hidden');
  try{
    scanner=new Html5Qrcode('qr-reader');
    scanner.start({facingMode:'environment'},{fps:10,qrbox:230},
      txt=>qrLogin(txt), ()=>{}
    ).catch(()=>toast('❌ تعذر فتح الكاميرا — تأكد من الصلاحيات أو ارفع صورة','err'));
  }catch(err){
    console.error('Scanner error:',err);
    toast('❌ القارئ غير مدعوم في هذا المتصفح — استخدم رفع صورة QR','err');
  }
}
function scanImageFile(input){
  const file=input.files[0]; if(!file) return;
  try{
    const h5=new Html5Qrcode('qr-reader');
    h5.scanFile(file,false).then(txt=>qrLogin(txt))
      .catch(()=>toast('❌ لم يتم العثور على QR صالح في الصورة','err'));
  }catch(err){
    console.error('File scan error:',err);
    toast('❌ تعذر قراءة الصورة','err');
  }
}
async function qrLogin(token){
  stopScanner();
  // التحقق الأمني: التوقيع HMAC + الصلاحية + نوع التوكن (نفس منطق /api/auth/qr-login)
  const payload=await verifyJWT(token);
  const u=payload && DB.read('users').find(x=>x.id===payload.sub);
  if(!u) return toast('❌ رمز QR غير صالح أو منتهي الصلاحية','err');
  saveSession({id:u.id,fullName:u.fullName,email:u.email,phone:u.phone});
  toast(`🔓 تم تسجيل الدخول عبر QR — أهلاً ${esc(u.fullName.split(' ')[0])}!`);
}

/* ══════════════════════ الصفحة الرئيسية ══════════════════════ */
function renderHome(){
  const slides=[
    {t:'خصم 20% على جميع الحزم',s:'استخدم كود: UC20 عند الدفع — لفترة محدودة',c:'from-yellow-600/40 via-night-700 to-night-900'},
    {t:'شحن فوري خلال 5 دقائق',s:'أسرع خدمة شدات في المنطقة 🚀',c:'from-blue-600/30 via-night-700 to-night-900'},
    {t:'حزمة 8100 UC + 900 مجاناً',s:'أعلى قيمة وأكبر بونص 👑',c:'from-purple-600/30 via-night-700 to-night-900'}
  ];
  let si=0;
  $('app').innerHTML=`
  <section class="relative">
    <div id="slider" class="relative h-72 sm:h-96 overflow-hidden">
      ${slides.map((s,i)=>`
        <div class="slide ${i===0?'active':''} absolute inset-0 bg-gradient-to-l ${s.c} flex items-center">
          <div class="px-8 sm:px-16 max-w-2xl">
            <h2 class="text-3xl sm:text-5xl font-black gold-text mb-3">${s.t}</h2>
            <p class="text-gray-300 text-lg mb-5">${s.s}</p>
            <button onclick="go('shop')" class="btn-gold px-8 py-3 rounded-xl">تسوّق الآن</button>
          </div>
        </div>`).join('')}
      <div class="absolute bottom-4 right-1/2 translate-x-1/2 flex gap-2" id="dots"></div>
    </div>
    <div class="max-w-6xl mx-auto px-4 -mt-10 relative z-10 grid grid-cols-1 sm:grid-cols-3 gap-4">
      ${[['⚡','تسليم فوري','خلال 5 دقائق'],['🛡️','دفع آمن 100%','تشفير كامل للبيانات'],['💬','دعم 24/7','فريق دعم متواصل']].map(([i,t,s])=>`
        <div class="glass rounded-2xl p-5 flex items-center gap-4">
          <span class="text-3xl">${i}</span><div><p class="font-bold text-yellow-400">${t}</p><p class="text-sm text-gray-400">${s}</p></div>
        </div>`).join('')}
    </div>
  </section>
  <section class="max-w-6xl mx-auto px-4 mt-16">
    <h2 class="text-2xl sm:text-3xl font-black gold-text mb-6 text-center">🔥 الحزم الأكثر طلباً</h2>
    <div id="homePkgs" class="grid grid-cols-2 md:grid-cols-3 gap-5"></div>
    <div class="text-center mt-8"><button onclick="go('shop')" class="btn-gold px-10 py-3 rounded-xl">عرض جميع الحزم</button></div>
  </section>`;
  renderPackageCards($('homePkgs'), DB.read('packages').slice(0,3));
  // تشغيل السلايدر
  const dots=$('dots');
  slides.forEach((_,i)=>{const d=document.createElement('button');d.onclick=()=>show(i);d.className='w-3 h-3 rounded-full bg-white/30';dots.appendChild(d);});
  function show(i){
    document.querySelectorAll('.slide').forEach((s,j)=>s.classList.toggle('active',j===i));
    dots.querySelectorAll('button').forEach((d,j)=>d.classList.toggle('bg-yellow-400',j===i));
    si=i;
  }
  show(0);
  setInterval(()=>show((si+1)%slides.length),5000);
}

/* ══════════════════════ المتجر + الشراء ══════════════════════ */
function renderShop(){
  $('app').innerHTML=`
  <section class="max-w-6xl mx-auto px-4 py-12">
    <h1 class="text-3xl font-black gold-text text-center mb-2">💰 حزم شدات ببجي موبايل</h1>
    <p class="text-center text-gray-400 mb-10">اختر حزمتك وستصلك فوراً على حسابك</p>
    <div id="shopPkgs" class="grid grid-cols-2 md:grid-cols-3 gap-6"></div>
  </section>`;
  renderPackageCards($('shopPkgs'), DB.read('packages'));
}
function renderPackageCards(el,pkgs){
  el.innerHTML=pkgs.map(p=>`
    <div class="glass card-hover rounded-2xl p-5 text-center relative ${p.badge?'border-yellow-500/50':''}">
      ${p.badge?`<span class="absolute -top-3 right-1/2 translate-x-1/2 btn-gold text-xs px-3 py-1 rounded-full whitespace-nowrap">${p.badge}</span>`:''}
      <div class="text-5xl mb-2">${p.logo}</div>
      <p class="text-lg font-black text-white">${p.uc} UC</p>
      ${p.bonus?`<p class="text-xs text-yellow-400 font-bold">${p.bonus} مجاناً</p>`:''}
      <p class="text-2xl font-black gold-text my-3">${p.price}</p>
      <button onclick="openCheckout('${p.id}')" class="btn-gold w-full py-2.5 rounded-xl text-sm">شراء الآن</button>
    </div>`).join('');
}
function openCheckout(pid){
  const p=DB.read('packages').find(x=>x.id===pid);
  if(!p) return toast('❌ الحزمة غير موجودة','err');
  openModal(`
    <h2 class="text-xl font-black gold-text mb-1">شراء ${p.uc} UC</h2>
    <p class="text-gray-400 text-sm mb-5">السعر: <span class="text-yellow-400 font-bold">${p.price}</span> ${p.bonus?`| بونص <span class="text-yellow-400">${p.bonus}</span>`:''}</p>
    <form onsubmit="submitOrder(event,'${pid}')" class="space-y-4">
      <div><label class="text-xs font-bold text-gray-400">PUBG Player ID</label>
        <input id="pl_id" required inputmode="numeric" class="w-full rounded-xl px-4 py-3 mt-1 font-mono" placeholder="مثال: 5123456789"
               oninput="const v=this.value.replace(/\\D/g,'');this.value=v;$('pl_err').textContent=(v.length>0&&(v.length<6||v.length>14))?'⚠️ الآيدي يجب أن يكون بين 6 و 14 رقماً':'';">
        <p id="pl_err" class="text-red-400 text-xs mt-1"></p></div>
      <div><label class="text-xs font-bold text-gray-400">طريقة الدفع</label>
        <select id="pay_m" class="w-full rounded-xl px-4 py-3 mt-1">
          <option value="zain">Zain Cash</option>
          <option value="asia">Asia Hawala</option>
          <option value="usdt">USDT (TRC20)</option>
          <option value="manual">تحويل يدوي + إيصال</option>
        </select></div>
      <div id="receiptBox" class="hidden"><label class="text-xs font-bold text-gray-400">رفع إيصال الدفع</label>
        <input type="file" accept="image/*" class="w-full rounded-xl px-4 py-2.5 mt-1 bg-night-700"></div>
      <div class="glass rounded-xl p-3 text-sm text-gray-300">💳 بعد إتمام الطلب سيتم الشحن على الآيدي المدخل والتنبيه فور تغيّر الحالة.</div>
      <button class="btn-gold w-full py-3 rounded-xl">تأكيد الطلب ✅</button>
    </form>`);
  $('pay_m').onchange=e=>$('receiptBox').classList.toggle('hidden',e.target.value!=='manual');
}
function submitOrder(e,pid){
  e.preventDefault();
  try{
    const p=DB.read('packages').find(x=>x.id===pid);
    if(!p) return toast('❌ الحزمة غير موجودة','err');
    const playerId=$('pl_id').value.trim();
    if(playerId.length<6||playerId.length>14) return toast('❌ آيدي اللاعب غير صالح','err');
    const orders=DB.read('orders');
    const order={id:uid('o'),userId:currentUser.id,packageId:pid,uc:p.uc,price:p.price,playerId,
      paymentMethod:$('pay_m').value,
      receiptName:$('receiptBox').querySelector('input').files[0]?.name||'',
      status:'pending',createdAt:Date.now()};
    orders.unshift(order); DB.write('orders',orders);
    closeModal(); toast(`🎉 تم إنشاء طلبك (${p.uc} UC) — الحالة: قيد الانتظار`);
    go('dash');
  }catch(err){
    console.error('Order error:',err);
    toast('❌ حدث خطأ: '+esc(err.message||err),'err');
  }
}

/* ══════════════════════ لوحة الملف الشخصي ══════════════════════ */
function statusBadge(st){
  return {pending:'<span class="text-xs px-3 py-1 rounded-full bg-yellow-500/20 text-yellow-400 font-bold">⏳ قيد الانتظار</span>',
          shipped:'<span class="text-xs px-3 py-1 rounded-full bg-blue-500/20 text-blue-400 font-bold">🚚 تم الشحن</span>',
          completed:'<span class="text-xs px-3 py-1 rounded-full bg-green-500/20 text-green-400 font-bold">✅ مكتملة</span>',
          cancelled:'<span class="text-xs px-3 py-1 rounded-full bg-red-500/20 text-red-400 font-bold">❌ ملغاة</span>'}[st]||'';
}
function renderDash(){
  const u=DB.read('users').find(x=>x.id===currentUser.id);
  if(!u){ saveSession(null); return; }
  const orders=DB.read('orders').filter(o=>o.userId===currentUser.id);
  $('app').innerHTML=`
  <section class="max-w-5xl mx-auto px-4 py-10 grid lg:grid-cols-3 gap-6">
    <!-- كرت المستخدم + QR -->
    <div class="glass rounded-3xl p-6 text-center h-fit">
      <div class="w-20 h-20 mx-auto rounded-full btn-gold flex items-center justify-center text-3xl font-black mb-3">${esc(u.fullName[0])}</div>
      <h2 class="text-lg font-black">${esc(u.fullName)}</h2>
      <p class="text-gray-400 text-sm">${esc(u.email)}</p>
      <p class="text-gray-500 text-xs mb-4">${esc(u.phone)}</p>
      <div class="bg-white rounded-2xl p-4 inline-block mb-3" id="qrBox"></div>
      <p class="text-xs text-gray-500 mb-3">امسح هذا الرمز للدخول بدون كلمة سر</p>
      <button onclick="downloadQR()" class="btn-gold w-full py-2.5 rounded-xl text-sm mb-2">⬇️ تحميل QR كصورة</button>
      <button onclick="copyToken()" class="w-full py-2.5 rounded-xl bg-night-600 hover:bg-night-500 text-sm font-bold text-gray-300">📋 نسخ رمز QR Token</button>
      <div class="mt-3 text-xs text-gray-600 font-mono break-all">ID: ${u.id}</div>
    </div>
    <!-- الطلبات -->
    <div class="lg:col-span-2">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-black gold-text">سجل الطلبات</h2>
        <button onclick="go('shop')" class="btn-gold px-5 py-2 rounded-lg text-sm">+ طلب جديد</button>
      </div>
      <div class="space-y-3">
        ${orders.length?orders.map(o=>`
          <div class="glass rounded-2xl p-5 flex flex-wrap items-center justify-between gap-3">
            <div>
              <p class="font-black text-lg">${o.uc} UC <span class="text-sm text-gray-400 font-normal">— ${esc(o.playerId)}</span></p>
              <p class="text-xs text-gray-500 mt-1">${o.price} • ${new Date(o.createdAt).toLocaleString('ar')} • ${o.paymentMethod.toUpperCase()}${o.receiptName?' • 🧾 '+esc(o.receiptName):''}</p>
            </div>
            ${statusBadge(o.status)}
          </div>`).join('')
        :`<div class="glass rounded-2xl p-10 text-center text-gray-500">لا توجد طلبات بعد — ابدأ أول شحنة لك! 🚀</div>`}
      </div>
    </div>
  </section>`;
  $('qrBox').innerHTML='';
  try{
    new QRCode($('qrBox'),{text:u.qrToken,width:170,height:170,colorDark:'#0a0a0f',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
  }catch(err){
    console.error('QR error:',err);
    $('qrBox').innerHTML='<p class="text-red-600 text-xs p-4">تعذر توليد QR — تحقق من الاتصال بمكتبة qrcode</p>';
  }
}
function downloadQR(){
  const canvas=$('qrBox').querySelector('canvas');
  if(!canvas) return toast('❌ لم يتم توليد QR بعد','err');
  const a=document.createElement('a');
  a.href=canvas.toDataURL('image/png');
  a.download='uc-store-qr-'+currentUser.id+'.png';
  a.click();
  toast('⬇️ تم تحميل رمز QR — احفظه لتسجيل الدخول السريع');
}
function copyToken(){
  const u=DB.read('users').find(x=>x.id===currentUser.id);
  navigator.clipboard.writeText(u.qrToken).then(()=>toast('📋 تم نسخ التوكن'));
}

/* ══════════════════════ نظام الإشعارات + محاكاة تغيّر الحالة (Demo) ══════════════════════ */
function notifyStatusChange(orderId,newStatus){
  toast(`🔔 تم شحن طلبك #${orderId} بنجاح! تحقق من حسابك`);
}
// زر ديمو في الكونسول لتجربة تغيّر حالة طلب: shipOrder('o_xxx')
window.shipOrder=function(orderId){
  const orders=DB.read('orders');
  const o=orders.find(x=>x.id===orderId); if(!o) return 'order not found';
  o.status='shipped'; DB.write('orders',orders);
  if(currentUser&&o.userId===currentUser.id) notifyStatusChange(orderId,'shipped');
  return 'shipped';
};

/* ══════════════════════ الإقلاع ══════════════════════ */
renderNav();
go(currentUser?'home':'auth');
</script>
</body>
