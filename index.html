<script>
/* ───── قاعدة البيانات المحلية (localStorage) ───── */
const DB = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },

let session  = DB.get("uc_session", null);
let orders   = DB.get("uc_orders", []);
let notifSeen= DB.get("uc_notif_seen", {});

/* الحزم الافتراضية */
const PACKAGES = [
  { id:"p60",   name:"60 UC",    uc:60,   bonus:0,  price:5,  old:6,  icon:"🪙" },
  { id:"p325",  name:"325 UC",   uc:325,  bonus:25, price:22, old:28, icon:"💰", hot:true },
  { id:"p660",  name:"660 UC",   uc:660,  bonus:60, price:44, old:55, icon:"💎", hot:true },
  { id:"p1800", name:"1800 UC",  uc:1800, bonus:180,price:115,old:145, icon:"👑" },
  { id:"p3850", name:"3850 UC",  uc:3850, bonus:400,price:230,old:290, icon:"🏆" },
  { id:"p8100", name:"8100 UC",  uc:8100, bonus:900,price:450,old:560, icon:"🔥", best:true },
];

/* ───── أدوات ───── */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, ok = true) {
  const t = $("toast");
  t.textContent = msg;
  t.className = t.className.replace("hidden", "");
  t.style.borderColor = ok ? "rgba(245,197,66,.5)" : "rgba(248,113,113,.5)";
  setTimeout(() => t.classList.add("hidden"), 3000);
}
/* توليد توكن عشوائي آمن (256-bit) */
function randomToken() {
  const a = new Uint8Array(32);
  crypto.getRandomValues(a);
  return [...a].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function hashPassword(pw) {
  const buf = await crypto.subtle.digest("SHA-256",
    new TextEncoder().encode("ucsalt$" + pw));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function currentUser() { return users.find(u => u.id === session); }
function updateNav() {
  const u = currentUser();
  $("navLinks").innerHTML = u
    ? `<span class="text-gold hidden sm:inline">مرحباً ${esc(u.fullName)}</span>
       <button onclick="go('dash')" class="text-neon hover:underline">لوحتي</button>
       <button onclick="logout()" class="text-red-400 hover:underline">خروج</button>`

       <button onclick="go('register')" class="btn-gold !py-1.5 !px-4 !w-auto">إنشاء حساب</button>`;
}

        ${p.hot ? `<span class="badge bg-red-500/90 text-white absolute top-3 right-3">الأكثر مبيعاً</span>` : ""}
        ${p.best ? `<span class="badge bg-gold text-black absolute top-3 right-3">أفضل قيمة</span>` : ""}
        <div class="text-4xl mb-2">${p.icon}</div>
        <div class="text-xl font-black text-gold">${p.name}</div>
        ${p.bonus ? `<div class="text-xs text-neon mb-1">+${p.bonus} UC إضافية 🎁</div>` : `<div class="mb-1">&nbsp;</div>`}
        <div class="mt-2">
          <span class="text-lg font-bold">${p.price}$</span>
          ${p.old ? `<span class="text-gray-500 line-through text-sm mr-2">${p.old}$</span>` : ""}
        </div>
      </div>`).join("")}
    </div>
    <div class="grid sm:grid-cols-3 gap-4 mt-10">
      ${[["⚡","تسليم فوري","شحن تلقائي خلال دقائق"],["🛡️","دفع آمن","تشفير كامل وحماية بيانات"],["💬","دعم 24/7","فريق دعم متواصل دائماً"]]
      .map(([i,t,d]) => `<div class="glass p-5 text-center"><div class="text-3xl mb-2">${i}</div>
        <div class="font-bold">${t}</div><div class="text-sm text-gray-400">${d}</div></div>`).join("")}
    </div>
  </div>`;
  initSlider();
};

/* السلايدر المتحرك */
function initSlider() {
  const slides = [
    { bg: "from-amber-600/30 to-night", t: "خصم 25% على جميع الحزم 🎉", s: "استخدم كود: UC25" },
    { bg: "from-sky-600/30 to-night", t: "شحن فوري خلال دقائق ⚡", s: "أسرع متجر UC في المنطقة" },
    { bg: "from-purple-600/30 to-night", t: "حزمة 8100 UC + 900 مجاناً 👑", s: "لفترة محدودة فقط" },
  ];
  const el = $("slides"), dots = $("dots");
  el.innerHTML = slides.map(s => `
    <div class="min-w-full h-full bg-gradient-to-br ${s.bg} flex flex-col items-center justify-center gap-2">
      <div class="text-2xl sm:text-4xl font-black text-gold text-center px-4">${s.t}</div>
      <div class="text-gray-300 text-sm sm:text-lg">${s.s}</div>
    </div>`).join("");
  dots.innerHTML = slides.map((_, i) =>
    `<span class="dot w-2.5 h-2.5 rounded-full bg-white/30 cursor-pointer" data-i="${i}"></span>`).join("");
  let idx = 0;
  const show = i => {
    idx = i; el.style.transform = `translateX(${i * 100}%)`; // RTL
    document.querySelectorAll(".dot").forEach((d, j) =>
      d.className = `dot w-2.5 h-2.5 rounded-full cursor-pointer ${j === i ? "bg-gold" : "bg-white/30"}`);
  };
  document.querySelectorAll(".dot").forEach(d => d.onclick = () => show(+d.dataset.i));
  show(0);
  window._sliderTimer && clearInterval(window._sliderTimer);
  window._sliderTimer = setInterval(() => show((idx + 1) % slides.length), 4000);
}

/* ─── تسجيل الدخول عبر QR ─── */
function qrLogin(qrPayload) {
  const user = users.find(u => u.qrToken === qrPayload);
  if (!user) return toast("رمز QR غير صالح ❌", false);
  session = user.id; DB.set("uc_session", session); updateNav();
  toast(`أهلاً ${user.fullName} 👋`); go("home");
}
async function startScan() {
  const canvas = $("qr_canvas");
  canvas.style.display = "block";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    const video = document.createElement("video");
    video.srcObject = stream; video.setAttribute("playsinline", ""); video.play();
    const tick = () => {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);
        const img = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(img.data, img.width, img.height);
        if (code) { stream.getTracks().forEach(t => t.stop()); qrLogin(code.data); return; }
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  } catch { toast("تعذّر الوصول للكاميرا — استخدم رفع الصورة", false); }
}
document.addEventListener("change", async (e) => {
  if (e.target.id !== "qr_file" || !e.target.files[0]) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    c.getContext("2d").drawImage(img, 0, 0);
    const d = c.getContext("2d").getImageData(0, 0, c.width, c.height);
    const code = jsQR(d.data, d.width, d.height);
    code ? qrLogin(code.data) : toast("الصورة لا تحتوي على QR صالح", false);
  };
  img.src = URL.createObjectURL(e.target.files[0]);
});

    const data = {

/* ═══ شاشة QR بعد التسجيل ═══ */
function showQrResult(qrToken) {
  $("app").innerHTML = `
  <div class="fade max-w-md mx-auto glass p-8 text-center shadow-glow">
    <h1 class="text-2xl font-black text-gold mb-2">تم إنشاء حسابك ✅</h1>
    <p class="text-gray-400 text-sm mb-6">احفظ هذا الرمز — يمكنك استخدامه لتسجيل الدخول بدون كلمة السر</p>
    <div class="inline-block bg-night p-4 rounded-2xl border border-gold/30 mb-6" id="qr_box"></div><br>
    <button onclick="downloadQr('${qrToken}')" class="btn-gold w-full mb-3">⬇️ تحميل QR كصورة</button>
    <button onclick="go('login')" class="w-full text-neon hover:underline text-sm">الانتقال لتسجيل الدخول</button>
  </div>`;
  QRCode.toCanvas(document.getElementById("qr_box").appendChild(document.createElement("canvas")),
    qrToken, { width: 220, margin: 2, color: { dark: "#f5c542", light: "#0a0a0f" } });
}
function downloadQr(token) {
  const c = document.createElement("canvas");
  QRCode.toCanvas(c, token, { width: 600, margin: 2,
    color: { dark: "#f5c542", light: "#0a0a0f" } }, () => {
    const a = document.createElement("a");
    a.href = c.toDataURL("image/png"); a.download = "my-login-qr.png"; a.click();
  });
}

      <p class="text-xs text-gray-500">تجده في اللعبة: الملف الشخصي ← الأساسي ← معرّف اللاعب</p>
      <div class="glass p-3 space-y-2">
        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="pay" value="بطاقة إلكترونية" checked class="accent-gold"> 💳 بطاقة إلكترونية</label>
        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="pay" value="محفظة إلكترونية" class="accent-gold"> 📱 محفظة إلكترونية</label>
        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="pay" value="تحويل يدوي" class="accent-gold"> 🧾 تحويل يدوي (رفع إيصال)</label>
      </div>
      <div id="ck_receipt" class="hidden">
        <label class="text-sm text-gray-400 block mb-1">صورة الإيصال</label>
        <input type="file" accept="image/*" class="input-dark !py-2">
      </div>
      <p id="ck_err" class="text-red-400 text-sm text-center hidden"></p>
      <button class="btn-gold w-full">تأكيد الطلب</button>
      <button type="button" onclick="go('home')" class="w-full text-sm text-gray-400 hover:text-white">إلغاء</button>
    </form>
  </div>`;
  document.querySelector('input[name="pay"]').closest("form").addEventListener("change", e => {
    if (e.target.name === "pay") $("ck_receipt").classList.toggle("hidden", e.target.value !== "تحويل يدوي");
  });
  $("ck_pid").closest("form").onsubmit = (e) => {
    e.preventDefault();
    const pid = $("ck_pid").value.trim();
    const err = $("ck_err");
    if (!/^\d{6,12}$/.test(pid)) { err.textContent = "الآيدي غير صالح (6-12 رقم)"; err.classList.remove("hidden"); return; }
    const pay = document.querySelector('input[name="pay"]:checked').value;
    const order = { id: "o_" + randomToken().slice(0, 12), userId: session, pkgId: checkoutPkg.id,
      playerId: pid, pay: pay, price: checkoutPkg.price, status: "pending", at: Date.now(), seen: false };
    orders.push(order); DB.set("uc_orders", orders);
    setTimeout(() => { // محاكاة معالجة الطلب من لوحة الأدمن
      const o = orders.find(x => x.id === order.id);
      o.status = "shipped"; o.seen = false; DB.set("uc_orders", orders);
    }, 15000);
    $("app").innerHTML = `<div class="fade max-w-md mx-auto glass p-10 text-center shadow-glow">
      <div class="text-5xl mb-4">🎉</div>
      <h1 class="text-2xl font-black text-gold mb-2">تم استلام طلبك!</h1>
      <p class="text-gray-400 text-sm mb-6">رقم الطلب: #${order.id.slice(-4)}<br>ستصلك إشعارات فور تغيّر الحالة</p>
      <button onclick="go('dash')" class="btn-gold w-full">عرض سجل الطلبات</button></div>`;
  };
}

/* ───── التنقل ───── */
function go(page) {
  window.scrollTo(0, 0);
  (pages[page] || pages.home)();
  updateNav();
}
function logout() {
  session = null; DB.set("uc_session", null);
  updateNav(); go("home"); toast("تم تسجيل الخروج");
}
go(session && currentUser() ? "dash" : "home");
</script>
</body>
</html>
